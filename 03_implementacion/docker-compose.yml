services:
  kestra:
    image: kestra/kestra:latest
    command: server local
    ports:
      - "8082:8080"
    volumes:
      - kestra-data:/app/storage	


  influxdb:
    image: influxdb:2
    ports:
      - "8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2

volumes:
  kestra-data:
  influxdb-data: